# Puerto del servidor (en local usa 8081; Render usa el puerto 8080 que asigna internamente)
server.port=${PORT:8081}
spring.application.name=styleFactory

# --- Base de Datos (Supabase) ---
# Estos valores se obtienen de la cadena de conexión de Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# En producción (Render) debe ser "update" para no perder datos.
# En local, si quieres recrear las tablas cada vez, puedes cambiarlo a "create" manualmente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Duración del access token: 86400000 ms = 24 horas.
# En Render puedes sobreescribir con JWT_SECRET y JWT_EXPIRATION (Environment).
jwt.secret=${JWT_SECRET:claveSecretaSuperSeguraParaStyleFactory2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.open-in-view=false

# OpenAPI / Swagger UI (https://stylefactoryapi.onrender.com/swagger-ui/index.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true